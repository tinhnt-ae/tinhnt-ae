name: Update GitLab Activity

on:
  schedule:
    # Chạy mỗi ngày lúc 9:00 UTC (16:00 VN)
    - cron: '0 9 * * *'
  workflow_dispatch: 
    # Cho phép chạy thủ công

jobs:
  update-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and update GitLab activity
        env:
          # GitLab.com
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          # Self-hosted GitLab
          GITLAB2_URL: ${{ secrets.GITLAB2_URL }}
          GITLAB2_USERNAME: ${{ secrets.GITLAB2_USERNAME }}
          GITLAB2_TOKEN: ${{ secrets.GITLAB2_TOKEN }}
          # Config
          MAX_EVENTS: '15'
        run: |
          node scripts/fetch-gitlab-activity.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "✅ Không có thay đổi"
          else
            git commit -m "chore: cập nhật GitLab activity [skip ci]"
            git push
            echo "✅ Đã cập nhật README với GitLab activity mới"
          fi
